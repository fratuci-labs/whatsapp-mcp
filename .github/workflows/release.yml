name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-Platform Binaries & Wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Python build venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip build setuptools

      - name: Build Pure-Go Binaries & Checksums
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.1"
          fi
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/whatsapp-mcp-${GOOS}-${GOARCH}${EXT}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "$OUT" .
          done
          (cd dist && sha256sum whatsapp-mcp-* > checksums.txt)

      - name: Build Platform-Specific Python Wheels (Stdlib Retagger)
        run: |
          .venv/bin/python - <<'PY'
          import base64
          import hashlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          plat_tags = {
              "darwin-arm64": ("whatsapp-mcp-darwin-arm64", "whatsapp-mcp", "macosx_11_0_arm64"),
              "darwin-amd64": ("whatsapp-mcp-darwin-amd64", "whatsapp-mcp", "macosx_10_15_x86_64"),
              "linux-amd64": ("whatsapp-mcp-linux-amd64", "whatsapp-mcp", "manylinux2014_x86_64"),
              "linux-arm64": ("whatsapp-mcp-linux-arm64", "whatsapp-mcp", "manylinux2014_aarch64"),
              "windows-amd64": ("whatsapp-mcp-windows-amd64.exe", "whatsapp-mcp.exe", "win_amd64"),
              "windows-arm64": ("whatsapp-mcp-windows-arm64.exe", "whatsapp-mcp.exe", "win_arm64"),
          }

          bin_dir = Path("python/whatsapp_mcp/bin")
          tmp_out = Path("dist-wheels")
          dist_dir = Path("dist")

          for _, (src_name, dst_name, tag) in plat_tags.items():
              shutil.rmtree(bin_dir, ignore_errors=True)
              shutil.rmtree(tmp_out, ignore_errors=True)
              bin_dir.mkdir(parents=True, exist_ok=True)
              dst = bin_dir / dst_name
              shutil.copy2(dist_dir / src_name, dst)
              dst.chmod(0o755)

              subprocess.run([".venv/bin/python", "-m", "build", "--wheel", "--outdir", str(tmp_out)], check=True)
              orig_whl = next(tmp_out.glob("*.whl"))
              new_name = orig_whl.name.replace("-py3-none-any.whl", f"-py3-none-{tag}.whl")
              target_whl = dist_dir / new_name

              with zipfile.ZipFile(orig_whl, "r") as zin, zipfile.ZipFile(target_whl, "w", zipfile.ZIP_DEFLATED) as zout:
                  record_path = None
                  new_records = []
                  for item in zin.infolist():
                      data = zin.read(item.filename)
                      if item.filename.endswith(".dist-info/WHEEL"):
                          text = data.decode("utf-8").replace("Tag: py3-none-any", f"Tag: py3-none-{tag}")
                          data = text.encode("utf-8")
                      elif item.filename.endswith(".dist-info/RECORD"):
                          record_path = item.filename
                          continue
                      zout.writestr(item, data)
                      digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode("ascii")
                      new_records.append(f"{item.filename},sha256={digest},{len(data)}")
                  if record_path:
                      new_records.append(f"{record_path},,")
                      zout.writestr(record_path, ("\n".join(new_records) + "\n").encode("utf-8"))

          shutil.rmtree(bin_dir, ignore_errors=True)
          shutil.rmtree(tmp_out, ignore_errors=True)
          subprocess.run([".venv/bin/python", "-m", "build", "--sdist", "--outdir", str(dist_dir)], check=True)
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/whatsapp-mcp-*
            dist/checksums.txt
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
