name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-Platform Binaries & Wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packaging tools
        run: python3 -m pip install --upgrade pip build wheel

      - name: Build Pure-Go Binaries & Checksums
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            OUT="dist/whatsapp-mcp-${GOOS}-${GOARCH}${EXT}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "$OUT" .
          done
          (cd dist && sha256sum whatsapp-mcp-* > checksums.txt)

      - name: Build Platform-Specific Python Wheels (Offline-Capable)
        run: |
          declare -A PLAT_TAGS=(
            ["darwin-arm64"]="macosx_11_0_arm64"
            ["darwin-amd64"]="macosx_10_15_x86_64"
            ["linux-amd64"]="manylinux2014_x86_64"
            ["linux-arm64"]="manylinux2014_aarch64"
            ["windows-amd64"]="win_amd64"
            ["windows-arm64"]="win_arm64"
          )
          mkdir -p python/whatsapp_mcp/bin
          for key in "${!PLAT_TAGS[@]}"; do
            rm -f python/whatsapp_mcp/bin/*
            if [[ "$key" == windows-* ]]; then
              cp "dist/whatsapp-mcp-${key}.exe" "python/whatsapp_mcp/bin/whatsapp-mcp.exe"
            else
              cp "dist/whatsapp-mcp-${key}" "python/whatsapp_mcp/bin/whatsapp-mcp"
              chmod 755 "python/whatsapp_mcp/bin/whatsapp-mcp"
            fi
            python3 -m build --wheel --outdir dist-wheels
            WHEEL_FILE=$(ls dist-wheels/*.whl | head -n 1)
            python3 -m wheel tags --platform-tag "${PLAT_TAGS[$key]}" --remove "$WHEEL_FILE"
            mv dist-wheels/*.whl dist/
          done
          rm -rf python/whatsapp_mcp/bin dist-wheels
          python3 -m build --sdist --outdir dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/whatsapp-mcp-*
            dist/checksums.txt
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
